name: AI Newsletter

on:
  schedule:
    # 7 AM America/Chicago — both UTC firings; run_pipeline.py no-ops on the wrong one.
    - cron: "0 12 * * *"   # 7 AM CDT (Mar–Nov)
    - cron: "0 13 * * *"   # 7 AM CST (Nov–Mar)
  workflow_dispatch:
    inputs:
      mode:
        description: "daily | weekly (blank = weekday-based)"
        required: false
        default: ""
      force:
        description: "ignore the 7-AM gate"
        type: boolean
        default: true

permissions:
  contents: write   # to commit docs/ back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore subscribers.json from secret
        env:
          SUBSCRIBERS_JSON: ${{ secrets.SUBSCRIBERS_JSON }}
        run: |
          # Write the secret to disk without shell interpolation, then strip
          # any leading UTF-8 BOM (PowerShell uploads can introduce one).
          printenv SUBSCRIBERS_JSON | sed '1s/^\xEF\xBB\xBF//' > subscribers.json
          # Sanity check: must be valid JSON with a "subscribers" key.
          python -c "import json; d=json.load(open('subscribers.json',encoding='utf-8-sig')); assert 'subscribers' in d, 'missing subscribers key'; print(f'OK: {len(d[\"subscribers\"])} subscriber(s) loaded')"

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_CREDENTIALS_JSON: ${{ secrets.GMAIL_CREDENTIALS_JSON }}
          GMAIL_TOKEN_JSON: ${{ secrets.GMAIL_TOKEN_JSON }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
          NEWSLETTER_FROM_NAME: ${{ secrets.NEWSLETTER_FROM_NAME }}
          PAGES_BASE_URL: ${{ secrets.PAGES_BASE_URL }}
          REDDIT_USER_AGENT: "ai-newsletter/0.1 (github actions)"
          MODEL_RANKER: "claude-sonnet-4-6"
          MODEL_TRANSLATOR: "claude-sonnet-4-6"
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ -n "${{ inputs.mode }}" ]; then ARGS="$ARGS --mode ${{ inputs.mode }}"; fi
            if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          fi
          python tools/run_pipeline.py $ARGS

      - name: Commit docs/ updates
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/)" ]; then
            git add docs/
            git commit -m "newsletter: publish $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no docs/ changes to commit"
          fi
